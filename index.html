<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your Utopia — AI Hub</title>
  <meta name="description" content="Create your Utopia is an AI creative hub for bringing any visual idea to life — logos, shirt designs, branding, posters and art, from a single prompt." />
  <style>
    :root {
      /* Deliberate, committed dark world — a creative canvas at dawn */
      --bg:        #0d0a12;
      --bg-rail:   #0a0810;
      --surface:   #16131f;
      --surface-2: #1c1826;
      --raised:    #221d30;
      --ink:       #f5f1fb;
      --ink-soft:  #a09bb8;
      --ink-faint: #6f6a82;
      --line:      rgba(255,255,255,0.08);
      --line-2:    rgba(255,255,255,0.13);
      /* Signature: dawn coral -> amber */
      --dawn-1:    #ff7d5c;
      --dawn-2:    #ffb454;
      --iris:      #7c6bff;
      --gold:      #ffcf5c;
      --good:      #58d6a0;
      --grad-dawn: linear-gradient(120deg, #ff7d5c 0%, #ff9a55 45%, #ffc24b 100%);
      --shadow:    0 24px 60px -20px rgba(0,0,0,0.75);
      --r:         18px;
      --ease:      cubic-bezier(0.22, 1, 0.36, 1);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; color: inherit; cursor: pointer; background: none; border: none; }
    ::selection { background: rgba(255,125,92,0.30); }
    :focus-visible { outline: 2px solid var(--dawn-2); outline-offset: 2px; border-radius: 6px; }

    /* ---------- App shell ---------- */
    .app {
      display: grid;
      grid-template-columns: 76px 1fr;
      height: 100vh;
      width: 100vw;
    }

    /* ---------- Sidebar rail ---------- */
    .rail {
      background: var(--bg-rail);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0 14px;
      gap: 8px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .rail::-webkit-scrollbar { display: none; }

    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--grad-dawn);
      display: grid; place-items: center;
      color: #1a0f0a; font-weight: 800; font-size: 20px;
      letter-spacing: -0.03em;
      box-shadow: 0 8px 22px -8px rgba(255,125,92,0.7);
      flex: none;
    }
    .ws-avatar {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(150deg, #4f7cff, #3457d5);
      color: #fff; font-weight: 700; font-size: 14px;
      display: grid; place-items: center; margin-bottom: 6px;
      flex: none;
    }
    .rail-sep { width: 34px; height: 1px; background: var(--line); margin: 4px 0; flex: none; }

    .rail-item {
      width: 52px; padding: 9px 0 7px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      border-radius: 12px;
      color: var(--ink-faint);
      transition: color .18s var(--ease), background .18s var(--ease);
      flex: none;
    }
    .rail-item svg { width: 21px; height: 21px; stroke-width: 1.8; }
    .rail-item span { font-size: 10.5px; letter-spacing: 0.01em; font-weight: 500; }
    .rail-item:hover { color: var(--ink); background: rgba(255,255,255,0.04); }
    .rail-item.active { color: var(--ink); }
    .rail-item.active svg { color: var(--dawn-2); }
    .rail-item.active::before {
      content: ""; position: absolute; left: 0; width: 3px; height: 26px;
      border-radius: 0 3px 3px 0; background: var(--grad-dawn);
    }
    .rail-item { position: relative; }
    .rail-spacer { flex: 1 1 auto; }

    /* ---------- Main column ---------- */
    .main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

    .topbar {
      height: 66px; flex: none;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 30px;
      border-bottom: 1px solid var(--line);
      background: rgba(13,10,18,0.7);
      backdrop-filter: blur(12px);
    }
    .topbar h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }

    .upgrade {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,207,92,0.10);
      border: 1px solid rgba(255,207,92,0.35);
      color: var(--gold);
      padding: 8px 15px; border-radius: 11px;
      font-size: 13.5px; font-weight: 600;
      transition: background .18s var(--ease), transform .18s var(--ease);
    }
    .upgrade:hover { background: rgba(255,207,92,0.18); transform: translateY(-1px); }
    .upgrade svg { width: 16px; height: 16px; }

    .credits {
      display: flex; align-items: center; gap: 7px;
      color: var(--ink); font-size: 14px; font-weight: 600;
      padding: 8px 13px; border-radius: 11px;
      border: 1px solid var(--line-2);
      font-variant-numeric: tabular-nums;
    }
    .credits svg { width: 17px; height: 17px; color: var(--dawn-2); }

    .icon-btn {
      width: 38px; height: 38px; border-radius: 11px;
      display: grid; place-items: center; color: var(--ink-soft);
      position: relative; transition: background .18s, color .18s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.05); color: var(--ink); }
    .icon-btn svg { width: 20px; height: 20px; }
    .dot-badge { position: absolute; top: 9px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--dawn-1); border: 2px solid var(--bg); }

    .user-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(150deg, #4f7cff, #3457d5);
      color: #fff; font-weight: 700; font-size: 15px;
      display: grid; place-items: center;
    }

    /* ---------- Scroll area ---------- */
    .canvas {
      flex: 1 1 auto; overflow-y: auto; padding: 0 30px 60px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.18) transparent;
    }
    .canvas::-webkit-scrollbar { width: 10px; }
    .canvas::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 20px; border: 3px solid var(--bg); }

    /* ---------- Hero / composer ---------- */
    .hero {
      position: relative;
      padding: 70px 0 20px;
      display: flex; flex-direction: column; align-items: center;
    }
    .hero-glow {
      position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
      width: 720px; height: 360px; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 40% 60% at 42% 30%, rgba(255,125,92,0.22), transparent 70%),
        radial-gradient(ellipse 40% 60% at 62% 40%, rgba(124,107,255,0.18), transparent 70%);
      filter: blur(20px);
    }
    .eyebrow {
      position: relative; z-index: 1;
      font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--dawn-2); margin-bottom: 16px;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .eyebrow::before, .eyebrow::after { content:""; width: 22px; height: 1px; background: linear-gradient(90deg, transparent, var(--dawn-2)); }
    .eyebrow::after { background: linear-gradient(90deg, var(--dawn-2), transparent); }

    .hero h2 {
      position: relative; z-index: 1;
      font-size: clamp(30px, 4.4vw, 50px);
      font-weight: 700; letter-spacing: -0.035em; line-height: 1.05;
      text-align: center; text-wrap: balance; max-width: 15ch;
    }
    .hero h2 em { font-style: normal; background: var(--grad-dawn); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero .sub {
      position: relative; z-index: 1;
      margin-top: 14px; color: var(--ink-soft); font-size: 16px; text-align: center; max-width: 46ch; text-wrap: balance;
    }

    .composer {
      position: relative; z-index: 1;
      width: 100%; max-width: 720px; margin-top: 34px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 22px;
      padding: 16px 16px 12px;
      box-shadow: var(--shadow);
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
    }
    .composer.focused { border-color: rgba(255,154,85,0.55); box-shadow: 0 0 0 4px rgba(255,125,92,0.10), var(--shadow); }
    .composer-top { display: flex; gap: 14px; align-items: flex-start; }
    .drop {
      width: 66px; height: 66px; flex: none; border-radius: 14px;
      border: 1.5px dashed var(--line-2);
      display: grid; place-items: center; color: var(--ink-faint);
      transition: border-color .18s, color .18s, background .18s;
    }
    .drop:hover { border-color: var(--dawn-2); color: var(--dawn-2); background: rgba(255,180,84,0.06); }
    .drop svg { width: 22px; height: 22px; }
    #prompt {
      flex: 1; border: none; background: none; resize: none;
      font-family: inherit;
      color: var(--ink); font-size: 16.5px; line-height: 1.5;
      padding: 8px 6px 0; min-height: 66px; max-height: 220px;
    }
    #prompt::placeholder { color: var(--ink-faint); }
    #prompt:focus { outline: none; }

    .composer-bottom {
      display: flex; align-items: center; gap: 10px;
      margin-top: 8px; padding-top: 10px;
    }
    .mini-btn {
      width: 34px; height: 34px; border-radius: 10px;
      display: grid; place-items: center; color: var(--ink-soft);
      border: 1px solid var(--line); transition: background .18s, color .18s, border-color .18s;
    }
    .mini-btn:hover { color: var(--ink); border-color: var(--line-2); background: rgba(255,255,255,0.04); }
    .mini-btn svg { width: 18px; height: 18px; }

    .model-pick {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 12px; border-radius: 10px;
      border: 1px solid var(--line); color: var(--ink);
      font-size: 13.5px; font-weight: 500;
      transition: background .18s, border-color .18s;
    }
    .model-pick:hover { background: rgba(255,255,255,0.04); border-color: var(--line-2); }
    .model-pick .diamond { width: 16px; height: 16px; color: var(--iris); }
    .model-pick .beta { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--iris); background: rgba(124,107,255,0.14); padding: 2px 6px; border-radius: 5px; }
    .model-pick .chev { width: 15px; height: 15px; color: var(--ink-soft); }

    .send {
      margin-left: auto; width: 40px; height: 40px; border-radius: 11px;
      display: grid; place-items: center;
      background: var(--surface-2); color: var(--ink-faint);
      border: 1px solid var(--line);
      transition: all .2s var(--ease);
    }
    .send svg { width: 19px; height: 19px; }
    .send.ready {
      background: var(--grad-dawn); color: #1a0f0a; border-color: transparent;
      box-shadow: 0 8px 20px -8px rgba(255,125,92,0.8);
    }
    .send.ready:hover { transform: translateY(-1px); }

    /* suggestion chips */
    .chips { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; max-width: 720px; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--line-2); color: var(--ink-soft);
      font-size: 13px; transition: all .18s var(--ease);
    }
    .chip svg { width: 14px; height: 14px; color: var(--dawn-2); }
    .chip:hover { color: var(--ink); border-color: rgba(255,154,85,0.5); background: rgba(255,154,85,0.06); transform: translateY(-1px); }

    /* ---------- Workflow browser ---------- */
    .browser { max-width: 1240px; margin: 46px auto 0; }
    .browser-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
    .browser-head h3 { font-size: 26px; font-weight: 700; letter-spacing: -0.025em; }

    .tabs {
      display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px;
      border-bottom: 1px solid var(--line); margin-bottom: 26px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      position: relative; padding: 11px 15px 14px; white-space: nowrap;
      color: var(--ink-soft); font-size: 14.5px; font-weight: 550;
      transition: color .18s;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--ink); }
    .tab.active::after {
      content: ""; position: absolute; left: 15px; right: 15px; bottom: -1px; height: 2px;
      background: var(--grad-dawn); border-radius: 2px;
    }

    .rail-head { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 16px; }
    .rail-head .title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
    .rail-head .title svg { width: 18px; height: 18px; color: var(--ink-faint); }
    .view-all { color: var(--ink-soft); font-size: 13.5px; font-weight: 550; display: inline-flex; align-items: center; gap: 4px; transition: color .18s; }
    .view-all:hover { color: var(--dawn-2); }
    .view-all svg { width: 15px; height: 15px; }

    /* card rails */
    .scroller { display: grid; grid-auto-flow: column; grid-auto-columns: 272px; gap: 18px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }
    .scroller::-webkit-scrollbar { height: 9px; }
    .scroller::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 20px; border: 2px solid var(--bg); }

    .card {
      scroll-snap-align: start;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); overflow: hidden;
      transition: transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
    }
    .card:hover { transform: translateY(-4px); border-color: var(--line-2); box-shadow: var(--shadow); }
    .thumb { position: relative; aspect-ratio: 4 / 3.1; display: grid; place-items: center; overflow: hidden; }
    .thumb svg { width: 100%; height: 100%; display: block; }
    .thumb .tag {
      position: absolute; top: 11px; left: 11px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
      padding: 5px 9px; border-radius: 7px;
      background: rgba(13,10,18,0.6); color: var(--ink); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .thumb .heart {
      position: absolute; top: 9px; right: 9px; width: 30px; height: 30px; border-radius: 9px;
      display: grid; place-items: center; color: #fff;
      background: rgba(13,10,18,0.5); backdrop-filter: blur(6px);
      opacity: 0; transition: opacity .18s, transform .18s; border: 1px solid rgba(255,255,255,0.12);
    }
    .thumb .heart svg { width: 15px; height: 15px; }
    .card:hover .heart { opacity: 1; }
    .heart:hover { transform: scale(1.08); color: var(--dawn-1); }
    .card-body { padding: 13px 15px 15px; }
    .card-body .name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
    .card-body .meta { margin-top: 4px; font-size: 12.5px; color: var(--ink-faint); display: flex; align-items: center; gap: 6px; }
    .card-body .meta .by { color: var(--ink-soft); }

    /* feature tiles */
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    .tile {
      position: relative; border-radius: var(--r); overflow: hidden;
      padding: 20px; min-height: 148px;
      display: flex; flex-direction: column; justify-content: space-between;
      border: 1px solid var(--line-2);
      transition: transform .2s var(--ease), box-shadow .2s var(--ease);
    }
    .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .tile .t-icon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: rgba(13,10,18,0.35); backdrop-filter: blur(4px); }
    .tile .t-icon svg { width: 21px; height: 21px; color: #fff; }
    .tile h4 { font-size: 17px; font-weight: 680; letter-spacing: -0.02em; color: #fff; }
    .tile p { font-size: 13px; color: rgba(255,255,255,0.82); margin-top: 3px; }
    .tile .arrow { position: absolute; bottom: 18px; right: 18px; color: #fff; opacity: .8; transition: transform .2s; }
    .tile:hover .arrow { transform: translate(3px,-3px); }
    .tile.t1 { background: linear-gradient(140deg, #ff7d5c, #ff5c8a); }
    .tile.t2 { background: linear-gradient(140deg, #7c6bff, #5a8bff); }
    .tile.t3 { background: linear-gradient(140deg, #f0a13a, #ffcf5c); }
    .tile.t4 { background: linear-gradient(140deg, #2fbf9b, #58d6a0); }

    .section-label {
      font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-faint); margin: 40px 0 16px;
    }

    /* toast */
    .toast {
      position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
      background: var(--raised); border: 1px solid var(--line-2);
      color: var(--ink); padding: 13px 18px; border-radius: 13px;
      display: flex; align-items: center; gap: 11px; font-size: 14px;
      box-shadow: var(--shadow); opacity: 0; pointer-events: none;
      transition: opacity .25s var(--ease), transform .25s var(--ease); z-index: 80;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast .spark { width: 20px; height: 20px; border-radius: 7px; background: var(--grad-dawn); display: grid; place-items: center; color:#1a0f0a; flex: none; }
    .toast .spark svg { width: 13px; height: 13px; }

    @media (max-width: 720px) {
      .app { grid-template-columns: 64px 1fr; }
      .topbar { padding: 0 16px; }
      .topbar h1 { font-size: 17px; }
      .upgrade span, .credits { display: none; }
      .canvas { padding: 0 16px 50px; }
      .hero { padding: 44px 0 10px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto; } }
  </style>
</head>
<body>
  <div class="app">
    <!-- ============ SIDEBAR RAIL ============ -->
    <aside class="rail">
      <div class="logo" title="Create your Utopia">U</div>
      <div class="ws-avatar">L</div>
      <div class="rail-sep"></div>

      <button class="rail-item" data-tip="Create">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>
        <span>Create</span>
      </button>
      <button class="rail-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.1 5.3L19.5 10l-5.4 1.7L12 17l-2.1-5.3L4.5 10l5.4-1.7z"/><path d="M18.5 4.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4L16.5 6.5l1.4-.6z"/></svg>
        <span>AI Hub</span>
      </button>
      <button class="rail-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>
        <span>Projects</span>
      </button>
      <button class="rail-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Templates</span>
      </button>
      <button class="rail-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M4 18l5-4 3 2 4-4 4 4"/></svg>
        <span>Graphics</span>
      </button>
      <button class="rail-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V6a2 2 0 0 1 2-2h6l6 6v10a0 0 0 0 1 0 0"/><path d="M8.5 11.5h5M8.5 15h7"/></svg>
        <span>Fonts</span>
      </button>
      <button class="rail-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.3-9.2-8.4C1.2 8.7 2.6 5.5 5.6 5.5c1.8 0 3.1 1 4.4 2.6C11.3 6.5 12.6 5.5 14.4 5.5c3 0 4.4 3.2 2.8 6.1C19 15.7 12 20 12 20z"/></svg>
        <span>Likes</span>
      </button>

      <div class="rail-spacer"></div>
      <button class="rail-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .8-1 1.7"/><circle cx="12" cy="16.5" r="0.6" fill="currentColor"/></svg>
        <span>Support</span>
      </button>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <header class="topbar">
        <h1>AI Hub</h1>
        <div class="topbar-right">
          <button class="upgrade">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 18h14l-1.4-8.2-3.4 2.9L12 8l-2.2 4.7-3.4-2.9z"/></svg>
            <span>Upgrade to Pro</span>
          </button>
          <div class="credits" title="Creation credits">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.3 9.2h4a1.7 1.7 0 0 1 0 3.4h-3a1.7 1.7 0 0 0 0 3.4h4"/></svg>
            <span id="creditCount">2,150</span>
          </div>
          <button class="icon-btn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
            <span class="dot-badge"></span>
          </button>
          <div class="user-avatar">L</div>
        </div>
      </header>

      <div class="canvas">
        <!-- ===== HERO / COMPOSER ===== -->
        <section class="hero">
          <div class="hero-glow"></div>
          <span class="eyebrow">Create your Utopia</span>
          <h2>What will you <em>bring to life</em> today?</h2>
          <p class="sub">Describe a logo, a shirt graphic, a full brand kit or a piece of art — and watch the idea take shape.</p>

          <div class="composer" id="composer">
            <div class="composer-top">
              <button class="drop" aria-label="Upload a reference image">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
              </button>
              <textarea id="prompt" placeholder="Describe what you want to create…  e.g. a minimalist logo for a coastal coffee roastery"></textarea>
            </div>
            <div class="composer-bottom">
              <button class="mini-btn" aria-label="Attach">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <button class="model-pick">
                <svg class="diamond" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l4 5-4 13-4-13z"/><path d="M4 8h16"/></svg>
                Agentic AI
                <span class="beta">Beta</span>
                <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <button class="send" id="send" aria-label="Generate">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
              </button>
            </div>
          </div>

          <div class="chips" id="chips">
            <button class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2 5 5 .5-4 3.5 1.5 5L12 14l-4.5 3 1.5-5-4-3.5 5-.5z"/></svg>Minimalist coffee brand logo</button>
            <button class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l4-3h8l4 3-3 3v9H7v-9z"/></svg>Retro surf-club t-shirt</button>
            <button class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-5 5-9 5-9z"/></svg>Bold streetwear print</button>
            <button class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 15l3-4 2 2 3-4"/></svg>Full brand kit for a plant shop</button>
          </div>
        </section>

        <!-- ===== WORKFLOW BROWSER ===== -->
        <section class="browser">
          <div class="browser-head">
            <h3>Start a workflow</h3>
          </div>

          <nav class="tabs" id="tabs">
            <button class="tab active">Discover</button>
            <button class="tab">Logos</button>
            <button class="tab">Shirt designs</button>
            <button class="tab">Branding</button>
            <button class="tab">Posters</button>
            <button class="tab">Merch</button>
            <button class="tab">Mockups</button>
            <button class="tab">Illustration</button>
            <button class="tab">Tools</button>
          </nav>

          <!-- feature tiles -->
          <div class="tiles">
            <button class="tile t1">
              <div class="t-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></div>
              <div><h4>Logo generator</h4><p>From prompt to polished mark in seconds.</p></div>
              <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </button>
            <button class="tile t2">
              <div class="t-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l4-3h8l4 3-3 3v9H7v-9z"/></svg></div>
              <div><h4>T-shirt designer</h4><p>Print-ready graphics on real garments.</p></div>
              <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </button>
            <button class="tile t3">
              <div class="t-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 14l4-4 3 3 4-5 5 6"/></svg></div>
              <div><h4>Brand kit builder</h4><p>Palette, type &amp; assets in one flow.</p></div>
              <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </button>
            <button class="tile t4">
              <div class="t-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.1 5.3L19.5 10l-5.4 1.7L12 17l-2.1-5.3L4.5 10l5.4-1.7z"/></svg></div>
              <div><h4>Art studio</h4><p>Turn a sentence into a framed piece.</p></div>
              <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
            </button>
          </div>

          <!-- rail: shirt designs -->
          <div class="rail-head">
            <div class="title">Shirt designs
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </div>
            <a class="view-all">View all <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
          </div>
          <div class="scroller" id="railShirts"></div>

          <!-- rail: logos & marks -->
          <div class="rail-head">
            <div class="title">Logos &amp; marks
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </div>
            <a class="view-all">View all <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
          </div>
          <div class="scroller" id="railLogos"></div>

          <!-- rail: posters & prints -->
          <div class="rail-head">
            <div class="title">Posters &amp; prints
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </div>
            <a class="view-all">View all <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
          </div>
          <div class="scroller" id="railPosters"></div>
        </section>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="spark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.1 5.3L19.5 10l-5.4 1.7L12 17l-2.1-5.3L4.5 10l5.4-1.7z"/></svg></span>
    <span id="toastMsg">Bringing your idea to life…</span>
  </div>

  <script>
    /* ---------- Generative thumbnail library (inline SVG, no external assets) ---------- */
    function garment(bodyColor, design, tag) {
      return `<svg viewBox="0 0 320 248" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <rect width="320" height="248" fill="${bodyColor.bg}"/>
        <!-- t-shirt silhouette -->
        <path d="M160 44 L120 34 L74 60 L88 96 L112 88 L112 214 L208 214 L208 88 L232 96 L246 60 L200 34 L160 44
                 C160 44 148 56 160 56 C172 56 160 44 160 44 Z" fill="${bodyColor.shirt}" stroke="${bodyColor.stroke}" stroke-width="1.5"/>
        ${design}
      </svg>`;
    }
    function poster(bg, art) {
      return `<svg viewBox="0 0 320 248" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <rect width="320" height="248" fill="${bg}"/>${art}</svg>`;
    }
    function logo(bg, art) {
      return `<svg viewBox="0 0 320 248" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <rect width="320" height="248" fill="${bg}"/>${art}</svg>`;
    }

    /* ------- Shirt designs ------- */
    const shirts = [
      { name: "Sure Club", by: "@driftco", tag: "Streetwear",
        svg: garment({bg:"#efe9dd", shirt:"#f4efe6", stroke:"#d8cfba"},
          `<circle cx="160" cy="130" r="34" fill="none" stroke="#2f6f8f" stroke-width="4"/>
           <path d="M132 138 q28 -22 56 0" fill="none" stroke="#2f6f8f" stroke-width="4"/>
           <path d="M138 128 q22 -16 44 0" fill="none" stroke="#e08a4b" stroke-width="4"/>
           <text x="160" y="192" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#2f6f8f">Sure Club</text>`) },
      { name: "Short &amp; Sweet", by: "@bakelab", tag: "Retro",
        svg: garment({bg:"#f3e7ea", shirt:"#f7eef0", stroke:"#e3ccd2"},
          `<path d="M120 118 q40 -30 80 0" fill="none" stroke="#7a3b4e" stroke-width="3"/>
           <text x="160" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#7a3b4e">Sweet</text>
           <path d="M124 168 h72" stroke="#c98aa0" stroke-width="3"/>
           <text x="160" y="192" text-anchor="middle" font-family="Arial" font-size="10" letter-spacing="3" fill="#a15f74">SO VERY</text>`) },
      { name: "Coffee First", by: "@mornings", tag: "Merch",
        svg: garment({bg:"#f0ba2e", shirt:"#f4c644", stroke:"#d8a41f"},
          `<rect x="140" y="112" width="40" height="34" rx="4" fill="none" stroke="#1c3a5e" stroke-width="4"/>
           <path d="M180 120 q14 0 14 10 t-14 10" fill="none" stroke="#1c3a5e" stroke-width="4"/>
           <path d="M150 104 q4 -8 0 -14 M162 104 q4 -8 0 -14" stroke="#1c3a5e" stroke-width="3" fill="none"/>
           <text x="160" y="176" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="15" fill="#1c3a5e">COFFEE FIRST</text>`) },
      { name: "Night Rider", by: "@volt", tag: "Graphic",
        svg: garment({bg:"#1a1a22", shirt:"#26262f", stroke:"#3a3a45"},
          `<circle cx="160" cy="126" r="30" fill="none" stroke="#ff7d5c" stroke-width="3"/>
           <path d="M138 150 L160 104 L182 150" fill="none" stroke="#ffb454" stroke-width="4"/>
           <path d="M148 138 h24" stroke="#ffb454" stroke-width="4"/>
           <text x="160" y="196" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="12" letter-spacing="4" fill="#ece7f5">NIGHT RIDER</text>`) },
      { name: "Bloom Wild", by: "@studioaster", tag: "Nature",
        svg: garment({bg:"#e6ede4", shirt:"#eef3ec", stroke:"#cdd8c8"},
          `<g stroke="#4b7a52" stroke-width="3" fill="none">
             <path d="M160 168 V116"/><path d="M160 132 q-18 -8 -22 -24 q20 2 22 20"/>
             <path d="M160 146 q18 -6 24 -22 q-22 0 -24 18"/></g>
           <circle cx="160" cy="108" r="9" fill="#e0894b"/>
           <text x="160" y="192" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#4b7a52">Bloom Wild</text>`) },
    ];

    /* ------- Logos ------- */
    const logos = [
      { name: "Meridian Coffee", by: "Brand kit", tag: "Logo",
        svg: logo("#14100c",
          `<circle cx="160" cy="108" r="40" fill="none" stroke="#ffb454" stroke-width="4"/>
           <path d="M126 118 q34 26 68 0" fill="none" stroke="#ff7d5c" stroke-width="4"/>
           <circle cx="160" cy="108" r="14" fill="#ffb454"/>
           <text x="160" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#f3ead9" letter-spacing="2">MERIDIAN</text>
           <text x="160" y="202" text-anchor="middle" font-family="Arial" font-size="9" letter-spacing="6" fill="#9c8f78">COFFEE ROASTERS</text>`) },
      { name: "Aster Studio", by: "Monogram", tag: "Mark",
        svg: logo("#101425",
          `<g transform="translate(160 118)"><path d="M0 -42 L36 21 L-36 21 Z" fill="none" stroke="#7c6bff" stroke-width="4"/>
           <path d="M0 -14 L18 21 L-18 21 Z" fill="#7c6bff"/></g>
           <text x="160" y="190" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="18" letter-spacing="3" fill="#e9e7ff">ASTER</text>`) },
      { name: "Fern &amp; Co.", by: "Wordmark", tag: "Logo",
        svg: logo("#0f1a14",
          `<g stroke="#58d6a0" stroke-width="3.5" fill="none"><path d="M160 150 V78"/>
           <path d="M160 96 q-20 -8 -26 -26 q22 2 26 22"/><path d="M160 116 q20 -8 26 -26 q-22 2 -26 22"/></g>
           <text x="160" y="188" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#d6f2e5">Fern &amp; Co.</text>`) },
      { name: "Volt Labs", by: "Icon", tag: "Mark",
        svg: logo("#1a1206",
          `<path d="M172 66 L132 128 H158 L148 186 L192 116 H164 Z" fill="#ffcf5c"/>
           <text x="160" y="212" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="16" letter-spacing="4" fill="#f6e6c2">VOLT</text>`) },
      { name: "Tide Surf", by: "Emblem", tag: "Logo",
        svg: logo("#08222b",
          `<circle cx="160" cy="112" r="42" fill="none" stroke="#3fb6d6" stroke-width="3"/>
           <path d="M122 118 q14 -14 26 0 t26 0 t26 0" fill="none" stroke="#3fb6d6" stroke-width="4"/>
           <path d="M122 130 q14 -14 26 0 t26 0 t26 0" fill="none" stroke="#7fd8ee" stroke-width="3"/>
           <text x="160" y="192" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" letter-spacing="5" fill="#cdeef7">TIDE SURF</text>`) },
    ];

    /* ------- Posters ------- */
    const posters = [
      { name: "Sunset Sessions", by: "@printhaus", tag: "Poster",
        svg: poster("#1b1220",
          `<circle cx="160" cy="120" r="52" fill="url(#g1)"/>
           <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf5c"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient></defs>
           <rect x="60" y="150" width="200" height="4" fill="#ff7d5c"/><rect x="60" y="160" width="200" height="4" fill="#ff7d5c" opacity=".6"/>
           <text x="160" y="200" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="20" fill="#fff">SUNSET</text>`) },
      { name: "Type Study 04", by: "@grids", tag: "Print",
        svg: poster("#efe9dd",
          `<text x="40" y="120" font-family="Georgia, serif" font-weight="bold" font-size="88" fill="#1c1a16">Aa</text>
           <rect x="40" y="150" width="240" height="3" fill="#ff7d5c"/>
           <text x="40" y="178" font-family="Arial" font-size="11" letter-spacing="3" fill="#63605a">GROTESQUE / DISPLAY</text>`) },
      { name: "Bold Horizons", by: "@arclab", tag: "Poster",
        svg: poster("#0d2b3a",
          `<path d="M0 180 Q160 90 320 180" fill="none" stroke="#3fb6d6" stroke-width="5"/>
           <path d="M0 200 Q160 120 320 200" fill="none" stroke="#58d6a0" stroke-width="5"/>
           <circle cx="160" cy="96" r="26" fill="#ffcf5c"/>
           <text x="160" y="150" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="22" letter-spacing="2" fill="#eafaff">HORIZONS</text>`) },
      { name: "Prism", by: "@studioaster", tag: "Art",
        svg: poster("#141018",
          `<polygon points="160,52 120,180 200,180" fill="url(#g2)" opacity=".9"/>
           <polygon points="160,72 132,180 188,180" fill="#7c6bff" opacity=".7"/>
           <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7d5c"/><stop offset="1" stop-color="#7c6bff"/></linearGradient></defs>
           <text x="160" y="212" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" letter-spacing="6" fill="#e7e3f2">PRISM</text>`) },
      { name: "Citrus Grove", by: "@mornings", tag: "Print",
        svg: poster("#f0ba2e",
          `<circle cx="160" cy="110" r="46" fill="#ff7d5c"/>
           <circle cx="160" cy="110" r="46" fill="none" stroke="#1c3a5e" stroke-width="3"/>
           <path d="M160 64 v92 M114 110 h92 M128 78 l64 64 M192 78 l-64 64" stroke="#1c3a5e" stroke-width="2" opacity=".5"/>
           <text x="160" y="192" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#1c3a5e">CITRUS GROVE</text>`) },
    ];

    const heartSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.3-9.2-8.4C1.2 8.7 2.6 5.5 5.6 5.5c1.8 0 3.1 1 4.4 2.6C11.3 6.5 12.6 5.5 14.4 5.5c3 0 4.4 3.2 2.8 6.1C19 15.7 12 20 12 20z"/></svg>`;
    function renderRail(el, items) {
      el.innerHTML = items.map(it => `
        <article class="card">
          <div class="thumb">${it.svg}
            <span class="tag">${it.tag}</span>
            <button class="heart" aria-label="Save">${heartSVG}</button>
          </div>
          <div class="card-body">
            <div class="name">${it.name}</div>
            <div class="meta"><span class="by">${it.by}</span> · Remix workflow</div>
          </div>
        </article>`).join("");
    }
    renderRail(document.getElementById("railShirts"), shirts);
    renderRail(document.getElementById("railLogos"), logos);
    renderRail(document.getElementById("railPosters"), posters);

    /* ---------- Composer interactivity ---------- */
    const prompt = document.getElementById("prompt");
    const send = document.getElementById("send");
    const composer = document.getElementById("composer");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toastMsg");

    function sync() {
      const has = prompt.value.trim().length > 0;
      send.classList.toggle("ready", has);
      prompt.style.height = "auto";
      prompt.style.height = Math.min(prompt.scrollHeight, 220) + "px";
    }
    prompt.addEventListener("input", sync);
    prompt.addEventListener("focus", () => composer.classList.add("focused"));
    prompt.addEventListener("blur", () => composer.classList.remove("focused"));

    let toastTimer;
    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }
    function generate() {
      const v = prompt.value.trim();
      if (!v) { prompt.focus(); return; }
      showToast("Generating: “" + (v.length > 42 ? v.slice(0, 42) + "…" : v) + "”");
      const c = document.getElementById("creditCount");
      const n = parseInt(c.textContent.replace(/,/g, ""), 10) - 10;
      c.textContent = n.toLocaleString();
    }
    send.addEventListener("click", generate);
    prompt.addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); generate(); }
    });

    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        prompt.value = chip.textContent.trim();
        prompt.focus(); sync();
      });
    });

    /* ---------- Tabs ---------- */
    document.querySelectorAll("#tabs .tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelector("#tabs .tab.active").classList.remove("active");
        tab.classList.add("active");
        showToast(tab.textContent.trim() + " — showing matching workflows");
      });
    });
  </script>
</body>
</html>
